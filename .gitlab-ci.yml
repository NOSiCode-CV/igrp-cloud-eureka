image: docker:28.2.2
services:
  - name: docker:28.2.2-dind
    command: [ "--tls=false", "--mtu=1240" ]
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  DOCKER_REGISTRY: registry.nosi.cv
  DOCKER_PROJECT: igrp
  IMAGE_NAME: igrp-eureka
  IMAGE_NAME_FULL: "$DOCKER_REGISTRY/$DOCKER_PROJECT/$IMAGE_NAME"
  IMAGE_TAG: latest
  
stages:
  - build
  - manifest

.build-template:
  only:
    - master
  before_script:
    - apk add --no-cache curl bash
    - docker login -u "$DOCKER_REGISTRY_USERNAME" -p "$DOCKER_REGISTRY_PASSWORD" "$DOCKER_REGISTRY"

build-arm64:
  stage: build
  extends: .build-template
  script:
    - docker buildx create --use --name amd64builder
    - docker buildx inspect --bootstrap
    - docker build --platform linux/arm64 -t $IMAGE_NAME_FULL:arm64 --push --output=type=image,name="$IMAGE_NAME_FULL:arm64",push=true .
  tags:
    - arm64
  only:
    - master

    
build-amd64:
  extends: .build-template
  stage: build
  script:
    - docker buildx create --use --name amd64builder
    - docker buildx inspect --bootstrap
    - docker build --platform linux/amd64 -t $IMAGE_NAME_FULL:amd64 --push --output=type=image,name="$IMAGE_NAME_FULL:amd64",push=true .
  only:
    - master

create-manifest:
  stage: manifest
  script:
    - docker login -u "$DOCKER_REGISTRY_USERNAME" -p "$DOCKER_REGISTRY_PASSWORD" "$DOCKER_REGISTRY"
    - docker manifest create "$IMAGE_NAME_FULL:$IMAGE_TAG" --amend "$IMAGE_NAME_FULL:amd64" --amend "$IMAGE_NAME_FULL:arm64"
    - docker manifest push $IMAGE_NAME_FULL:$IMAGE_TAG
  needs:
    - build-amd64
    - build-arm64
