image: docker:27.5.1
services:
  - name: docker:27.5.1-dind
    command: [ "--tls=false", "--mtu=1240" ]
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  DOCKER_REGISTRY: registry.nosi.cv
  DOCKER_PROJECT: igrp
stages:
  - build
build_docker_image:
  stage: build
  only:
    - master
  script:
    - docker login -u "$DOCKER_REGISTRY_USERNAME" -p "$DOCKER_REGISTRY_PASSWORD" "$DOCKER_REGISTRY"
    - docker build -t $DOCKER_REGISTRY/$DOCKER_PROJECT/igrp-eureka .
    - docker tag $DOCKER_REGISTRY/$DOCKER_PROJECT/igrp-eureka $DOCKER_REGISTRY/$DOCKER_PROJECT/igrp-eureka:$CI_PIPELINE_ID
    - docker push $DOCKER_REGISTRY/$DOCKER_PROJECT/igrp-eureka
    - docker push $DOCKER_REGISTRY/$DOCKER_PROJECT/igrp-eureka:$CI_PIPELINE_ID